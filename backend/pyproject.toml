[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"

dependencies = [
    "ag-ui-protocol>=0.1.18",
    "botocore>=1.43.11", # Fixes an error about a missing module on startup
    "fastapi[standard]>=0.136.1",
    "litellm>=1.85.0",
    "psycopg[binary]>=3.3.4",
    "txtai[ann,database,graph]>=9.9.0",
]

[project.scripts]
main = "backend.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"
